<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMFE de mantenimiento · App para el aula</title>
<meta name="description" content="Aplicación web para hacer AMFE de mantenimiento en clase: mapa del proceso, análisis de modos de fallo, NPR, acciones y evaluación del profesor. Sin registro.">
<style>
:root{--ink:#1C2530;--paper:#F4F2ED;--card:#FBF9F5;--line:#DDD8CE;--or:#E57A35;--or2:#B04E17;--bl:#3A6FA3;--bl2:#1F4E7E;--soft:#E4ECF4;--mut:#5A6470;--ok:#2E7D4F;--warn:#B7791F;--bad:#B03A2E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--bl)}
button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
button.acc{background:var(--or);color:var(--ink);border-color:var(--or);font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button.on{background:var(--bl2);color:#fff;border-color:var(--bl2)}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
textarea{resize:vertical;min-height:58px}
label{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);display:block;margin:0 0 4px}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:22px}
h3{font-size:16px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--ink);color:#F4F2ED}
.brand{font-size:17px;white-space:nowrap}
.brand b{color:var(--or)}
.who{flex:1;font-size:13px;color:#C9D2DC;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;gap:10px;align-items:center}
.tools button{background:transparent;color:#F4F2ED;border-color:#4A5868}
#saved{font-size:12px;color:#9AA6B4}
.steps{display:flex;gap:4px;padding:10px 18px 0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:50px;z-index:15}
.steps button{border:none;border-radius:8px 8px 0 0;background:transparent;padding:9px 14px;white-space:nowrap;color:var(--mut);border-bottom:3px solid transparent}
.steps button.cur{color:var(--ink);font-weight:700;border-bottom-color:var(--or)}
.steps button .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--line)}
.steps button .dot.ok{background:var(--ok)}.steps button .dot.part{background:var(--warn)}
main{max-width:1280px;margin:0 auto;padding:20px 18px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--mut)}
.small{font-size:13px}
.hint{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:14px}
.hint b{color:var(--bl2)}
.min{border-left:4px solid var(--or);background:#FBF3EC;border-radius:0 10px 10px 0;padding:10px 14px;font-size:14px}
.min ul{margin:6px 0 0;padding-left:18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kick{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--or2)}
details.caso{margin-bottom:14px}
details.caso summary{cursor:pointer;font-weight:700}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;vertical-align:top;padding:7px 9px;border-bottom:1px solid var(--line);font-size:14px}
th{background:var(--ink);color:#F4F2ED;font-size:12px;letter-spacing:.3px;text-transform:uppercase}
/* mapa */
.mapwrap{display:grid;grid-template-columns:170px 1fr 260px;gap:14px;align-items:start}
.palette{display:flex;flex-direction:column;gap:6px}
.palette button{display:flex;align-items:center;gap:8px;text-align:left;font-size:13px}
.palette .sw{width:14px;height:14px;border-radius:3px;flex:none}
.canvas{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none}
.canvas svg{display:block;width:100%;height:auto;user-select:none}
.canvas.connect{outline:3px solid var(--bl);outline-offset:-3px}
svg .node{cursor:grab}
svg .node.sel .shape{stroke:var(--or)!important;stroke-width:4!important}
svg .edge{cursor:pointer}
svg .edge.sel line{stroke:var(--or)}
.props{display:flex;flex-direction:column;gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500}
.chk input{width:auto}
/* fallos */
.fallo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fallo .fh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fallo .fh .n{font-weight:800;color:var(--or2);font-size:18px;min-width:34px}
.fgrid{display:grid;grid-template-columns:1fr 1fr 150px;gap:10px 14px;align-items:start}
.npr{display:inline-flex;align-items:center;justify-content:center;min-width:86px;padding:6px 12px;border-radius:999px;font-weight:800;font-size:15px;background:var(--line);color:var(--ink)}
.npr.lo{background:#D8EBDD;color:#1E5A38}.npr.mid{background:#F6DFC4;color:#7A4A12}.npr.hi{background:#F2CFCB;color:#7D2219}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--bl2)}
.tag.warn{background:#F2CFCB;color:#7D2219}
.tag.ok{background:#D8EBDD;color:#1E5A38}
.selhelp{font-size:12px;color:var(--mut);margin-top:3px;min-height:16px}
/* resumen */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-size:28px;font-weight:800}
.kpi .l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.checks{display:flex;flex-direction:column;gap:6px}
.ck{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid var(--line)}
.ck .i{font-weight:900;font-size:16px;text-align:center}
.ck.ok .i{color:var(--ok)}.ck.part .i{color:var(--warn)}.ck.no .i{color:var(--bad)}
.ck .d{font-size:13px;color:var(--mut)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(28,37,48,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
#modal[hidden]{display:none}
.mbox{background:var(--paper);border-radius:14px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
/* profesor */
#teacher{position:fixed;inset:0;z-index:40;background:var(--paper);overflow:auto}
#teacher[hidden]{display:none}
.tbar{position:sticky;top:0;display:flex;gap:12px;align-items:center;padding:10px 18px;background:var(--bl2);color:#fff;z-index:2}
.tbar button{background:transparent;color:#fff;border-color:#6E8FB3}
.tmain{max-width:1280px;margin:0 auto;padding:20px 18px 60px;display:flex;flex-direction:column;gap:16px}
.drop{border:2px dashed var(--bl);border-radius:12px;padding:18px;text-align:center;background:#fff}
.drop.over{background:var(--soft)}
.rub td{vertical-align:middle}.rub td:nth-child(3){white-space:nowrap}
.rub input[type=number]{width:70px}
.rub input[type=range]{width:140px}
.nota{font-size:34px;font-weight:800;color:var(--bl2)}
#report{display:none}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 8px;font-size:14px}
.crumbs button{padding:4px 10px;font-size:13px}
.crumbs .cur{font-weight:800}
.lint{font-size:13px;color:#7A4A12;background:#FFF4E5;border-radius:8px;padding:6px 10px}
.lint:empty{display:none}
.lint div+div{margin-top:3px}
.subcard{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mx{display:grid;grid-template-columns:28px repeat(10,1fr);gap:2px;font-size:11px;max-width:420px}
.mx .c{aspect-ratio:1/1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#1C2530;flex-wrap:wrap;line-height:1}
.mx .ax{display:flex;align-items:center;justify-content:center;color:var(--mut)}
.helpg dt{font-weight:800;margin-top:8px}.helpg dd{margin:2px 0 0 0;color:#3A4552}
.qr{background:#fff;padding:12px;border-radius:10px;display:inline-block}
.tools .tb{padding:6px 10px}
.mapbox svg{width:100%;height:100%;display:block}
#report body,#report{background:#fff}
@media (max-width:700px){
  html,body{font-size:15px;overflow-x:hidden}
  input,select,textarea{font-size:16px}
  .top{position:static;flex-wrap:wrap;gap:8px;padding:8px 12px}
  .brand{font-size:16px}
  .who,#saved{display:none}
  .tools{flex-wrap:wrap;gap:6px;margin-left:auto}
  .tools button{padding:6px 9px;font-size:14px}
  .steps{top:0;padding:6px 8px 0}
  .steps button{padding:8px 10px;font-size:14px}
  main{padding:14px 12px 50px}
  .card{padding:12px 13px}
  .grid2,.grid3,.fgrid,.mapwrap{grid-template-columns:1fr!important}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:22px}
  h2{font-size:19px}
  .head{align-items:flex-start}
  .head>*{max-width:100%}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .mbox{padding:16px 14px;max-height:92vh}
  #modal{padding:10px}
  .tbar{flex-wrap:wrap;padding:8px 12px}
  .tmain{padding:14px 12px 50px}
  .mx{max-width:100%}
  select{max-width:100%}
  td select{min-width:150px}
  .canvas{overflow-x:auto;touch-action:pan-x pan-y}
  .canvas svg{min-width:760px}
  td textarea,td input:not([type=checkbox]):not([type=range]){min-width:190px}
}
@media (max-width:1000px){.mapwrap{grid-template-columns:1fr}.palette{flex-direction:row;flex-wrap:wrap}.fgrid{grid-template-columns:1fr 1fr}.grid3,.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media print{
  body>*:not(#report){display:none!important}
  #report{display:block!important;font-size:11pt}
  #report .pb{page-break-before:always}
  #report table{page-break-inside:auto}
  #report tr{page-break-inside:avoid}
  #report th{background:#1C2530!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .npr{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:12mm}
}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

  out.push({k: 'mapa', t: 'Mapa del proceso', s: st(nN >= 4 && nN <= 8 && anal && con, nN >= 2),
    d: `${nN} bloques en el mapa general (mínimo 4, máximo recomendado 8) · ${E.length} flechas · equipo analizado ${anal ? 'marcado' : 'sin marcar'}${nSub ? ' · ' + nSub + (nSub > 1 ? ' mapas' : ' mapa') + ' de detalle' : ''}`});

  return out;
}

const NW = 150, NH = 70, VBW = 860, VBH = 420;

  const q = new QRLIB.QRCode(-1, QRLIB.L.M); q.addData(text); q.make(); const n = q.getModuleCount(), s = 6, m = 4; let p = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) p += `M${(c + m) * s},${(r + m) * s}h${s}v${s}h-${s}z`;
  const W = (n + 2 * m) * s; return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${W}" width="260" height="260" role="img" aria-label="Código QR"><rect width="${W}" height="${W}" fill="#fff"/><path d="${p}" fill="#1C2530"/></svg>`;
}
function shareModal() {
  const base = location.href.split('#')[0].split('?')[0];
  modal(`<h3>Compartir con la clase</h3><p class="small">Elige el caso y el umbral: el enlace abre la app con esos datos ya puestos. Proyecta el código QR o pega el enlace en Classroom.</p>
  <div class="grid3"><div><label>Caso</label><select id="shC"><option value="">Que lo elijan ellos</option>${Object.entries(CASOS).filter(([k]) => k !== 'libre').map(([k, c]) => `<option value="${k}">Caso ${k} · ${esc(c.t)}</option>`).join('')}</select></div><div><label>Umbral de NPR</label><input id="shU" type="number" value="100"></div><div><label>Curso</label><input id="shK" placeholder="Opcional"></div></div>
  <div class="row" style="align-items:flex-start;gap:20px"><div class="qr" id="shQ"></div><div class="stack" style="flex:1"><label>Enlace</label><textarea id="shL" rows="3" readonly></textarea><button class="pri" id="shCp">Copiar enlace</button>${/^https?:/.test(base) ? '' : '<p class="small" style="color:#B03A2E">Estás abriendo la app desde un archivo de tu ordenador: el enlace solo funcionará cuando la app esté publicada en internet (GitHub Pages).</p>'}</div></div>
  <div class="row" style="justify-content:flex-end"><button data-close>Cerrar</button></div>`, m => {
    const upd = () => { const q = new URLSearchParams(); const c = $('#shC', m).value, u = $('#shU', m).value, k = $('#shK', m).value.trim(); if (c) q.set('caso', c); if (u && u !== '100') q.set('umbral', u); if (k) q.set('curso', k); const url = base + (q.toString() ? '?' + q : ''); $('#shL', m).value = url; try { $('#shQ', m).innerHTML = qrSVG(url); } catch (e) { $('#shQ', m).textContent = 'No se ha podido generar el QR'; } };
    ['#shC', '#shU', '#shK'].forEach(s => $(s, m).oninput = $(s, m).onchange = upd); upd();
    $('#shCp', m).onclick = () => { copyText($('#shL', m).value); toast('Enlace copiado'); };
  });
}
function exportCSV() {
  const W = weights(); const rows = [['Grupo', 'Alumnos', 'Curso', 'Caso', 'Fallos', 'Mínimos cumplidos', ...W.map(r => r.t + ' (' + r.w + ' %)'), 'Nota calculada', 'Nota final', 'Evaluada', 'Comentario general']];
  Object.entries(T.entregas).forEach(([id, e]) => { const d = e.data, ev = T.evals[id], r = rubricRows(d, ev);
    rows.push([d.meta.grupo, d.meta.alumnos.split('\n').filter(Boolean).join(', '), d.meta.curso, d.meta.caso === 'libre' ? d.meta.casoTitulo : 'Caso ' + d.meta.caso, d.fallos.length, checks(d).filter(c => c.s === 'ok').length + '/8', ...r.rows.map(x => fmt(x.v)), fmt(r.calc), fmt(r.total), ev && ev.done ? 'Sí' : 'No', ev ? ev.general : '']); });
  const csv = '﻿' + rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(';')).join('\r\n');
  download('AMFE_notas_' + new Date().toISOString().slice(0, 10) + '.csv', csv, 'text/csv');
}

/* ---------- Deshacer / rehacer ---------- */
let hist = [], hi = -1, histT = null, restoring = false;
const snap = () => JSON.stringify(S, (k, v) => k === 'actualizado' ? undefined : v);
function pushHist() { if (restoring) return; const s = snap(); if (hist[hi] === s) return; hist = hist.slice(0, hi + 1); hist.push(s); if (hist.length > 80) hist.shift(); hi = hist.length - 1; updUndo(); }
function schedHist() { clearTimeout(histT); histT = setTimeout(pushHist, 450); }
function updUndo() { $('#btnUndo').disabled = hi <= 0; $('#btnRedo').disabled = hi >= hist.length - 1; $('#btnUndo').style.opacity = hi <= 0 ? .4 : 1; $('#btnRedo').style.opacity = hi >= hist.length - 1 ? .4 : 1; }
function restore(i) { clearTimeout(histT); pushHist(); if (i < 0 || i >= hist.length) return; hi = i; restoring = true; S = normalize(JSON.parse(hist[hi])); save(); hist[hi] = snap(); restoring = false; sel = null; connectFrom = null; render(); updUndo(); }
$('#btnUndo').onclick = () => restore(hi - 1);
$('#btnRedo').onclick = () => restore(hi + 1);
$('#btnSave').onclick = () => saveReport(S);
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && $('#teacher').hidden) { e.preventDefault(); saveReport(S); } });
document.addEventListener('keydown', e => { if (!$('#teacher').hidden || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return; const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z' && !e.shiftKey) { e.preventDefault(); restore(hi - 1); } else if ((e.ctrlKey || e.metaKey) && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); restore(hi + 1); } });
$('#btnHelp').onclick = () => modal(`<h3>Ayuda y glosario del AMFE</h3>
  <dl class="helpg">
  <dt>Modo de fallo</dt><dd>Cómo deja el equipo de hacer su función. <i>Ej.: el rodillo alimentador patina.</i></dd>
  <dt>Efecto</dt><dd>Lo que provoca el fallo cuando ocurre: parada, piezas malas, riesgo. <i>Ej.: paso incorrecto y golpe en el troquel.</i></dd>
  <dt>Causa</dt><dd>Por qué ocurre el fallo. <i>Ej.: rodillos desgastados o presión de apriete baja.</i></dd>
  <dt>Control actual</dt><dd>Lo que existe hoy para verlo venir antes del efecto. <i>Ej.: detector de paso que para la prensa.</i></dd>
  <dt>G · Gravedad</dt><dd>Lo grave que es el efecto. Si hay varios, el más grave.</dd>
  <dt>O · Ocurrencia</dt><dd>Con qué frecuencia ocurre: histórico, MTBF, órdenes de trabajo.</dd>
  <dt>D · Detección</dt><dd>Al revés: cuanto más difícil de detectar, más alta.</dd>
  <dt>NPR</dt><dd>G × O × D, de 1 a 1000. A partir del umbral (normalmente 100) hay que actuar.</dd>
  <dt>Mapa de detalle</dt><dd>Un bloque del mapa se puede abrir en mini procesos (doble clic o «Crear mapa de detalle»), cada uno con sus fallos.</dd>
  </dl>
  <h3>Atajos</h3><p class="small">Ctrl/Cmd + Z deshacer · Ctrl/Cmd + Y rehacer · Supr borrar el bloque o la flecha seleccionados · doble clic en un bloque para abrir su detalle.</p>
  <p class="small muted">AMFE de mantenimiento v${VERSION} · Licencia MIT · Todo se guarda solo en este navegador.</p>
  <div class="row" style="justify-content:flex-end"><button class="pri" data-close>Cerrar</button></div>`);

/* ---------- Arranque ---------- */
function applyParams() {
  const p = new URLSearchParams(location.search);
  if (p.get('caso') && CASOS[p.get('caso')] && !S.meta.caso) S.meta.caso = p.get('caso');
  if (p.get('umbral') && num(p.get('umbral'))) S.meta.umbral = num(p.get('umbral'));
  if (p.get('curso') && !S.meta.curso) S.meta.curso = p.get('curso');
}
applyParams();
if (location.hash === '#profesor') setTimeout(openTeacher, 0);
render(); pushHist();
$('#saved').textContent = localStorage.getItem(KEY) ? 'Recuperado de este navegador' : '';
</script>
